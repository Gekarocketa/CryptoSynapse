<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D12" />
    <title>CryptoSynapse - Crypto Intelligence & Sentiment</title>
    <meta name="description" content="Real-time cryptocurrency metrics, NLP-driven sentiment analysis, and smart price alerts." />
    <script>
      (function() {
        try {
          var urlTheme = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (urlTheme === 'light' || urlTheme === 'dark') ? urlTheme : (saved || (prefersDark ? 'dark' : 'light'));
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
